  publish:
    name: Publicar
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Baixar artefatos dos sistemas buildados
        uses: actions/download-artifact@v7
        with:
          path: staging
          merge-multiple: true

      - name: Gerar checksums, manifesto e página de download
        run: bash scripts/make-manifest.sh "$GITHUB_WORKSPACE/staging"

      - name: Pasta pronta para o servidor de download
        uses: actions/upload-artifact@v7
        with:
          name: vsgo-download
          path: staging/*
          if-no-files-found: error

      # Só os instaladores vão para a release: quem chega ali quer baixar e usar.
      # O manifest.json, o index.html e o SHA256SUMS.txt servem ao servidor de
      # download próprio e continuam completos no artifact vsgo-download. O
      # COMO-INSTALAR.md vira o texto da release, não um anexo. O hash de cada
      # arquivo o próprio GitHub já mostra na página.
      - name: Anexar os instaladores à release do GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          shopt -s nullglob
          assets=(staging/*.exe staging/*.dmg staging/*.zip staging/*.deb staging/*.tar.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "Nenhum instalador encontrado em staging/" >&2
            exit 1
          fi
          # A release pode já existir: criá-la pela interface do GitHub é uma das
          # formas de criar a tag que dispara este workflow. Nesse caso os
          # instaladores entram na release que já está lá, em vez de o build
          # inteiro falhar no último passo.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "vsgo ${GITHUB_REF_NAME#v}" \
              --notes-file staging/COMO-INSTALAR.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
